[package]
name = "podcast"
version = "0.1.0"
edition = "2021"
description = "Subscribe to podcast RSS feeds, download episodes (new or historical), and transcribe them locally with whisper.cpp."
license = "MIT"
repository = "https://github.com/srepho/podcast-transcriber"
readme = "README.md"
keywords = ["podcast", "rss", "whisper", "transcription", "speech-to-text"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "podcast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
feed-rs = "2"
indicatif = "0.18"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strsim = "0.11"
url = "2"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
