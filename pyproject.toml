# Optional research tooling (scripts/). The podcast CLI itself is the Rust crate in Cargo.toml.
[project]
name = "podcast-research-tools"
version = "0.1.0"
description = "Standard-library research export and review tooling for podcast transcripts"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 140
include = ["scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
check_untyped_defs = true
warn_unused_ignores = true
